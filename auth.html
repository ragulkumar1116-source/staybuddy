<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayBuddy - Authentication Portal</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-center py-4">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        
        <!-- Site Logo Header -->
        <div class="text-center mb-4">
          <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
            <span class="site-logo-container"><i class="bi bi-house-heart-fill text-primary display-5"></i></span>
            <span class="fw-bold fs-2 site-name text-dark">StayBuddy</span>
          </a>
          <p class="text-muted small mt-1">Affordable Stays. Trusted People. Better Connections.</p>
        </div>

        <div class="card border-0 shadow-lg p-4 rounded-4">
          
          <!-- Nav Tabs -->
          <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active fw-bold" id="login-tab" data-bs-toggle="pill" data-bs-target="#loginView">Log In</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link fw-bold" id="register-tab" data-bs-toggle="pill" data-bs-target="#registerView">Register</button>
            </li>
          </ul>

          <div class="tab-content">
            
            <!-- Login View -->
            <div class="tab-pane fade show active" id="loginView">
              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label fw-semibold">Email Address</label>
                  <input type="email" id="loginEmail" class="form-control form-control-lg" placeholder="name@example.com" required>
                </div>
                <div class="mb-4">
                  <div class="d-flex justify-content-between">
                    <label class="form-label fw-semibold">Password</label>
                    <a href="#forgot" data-bs-toggle="pill" data-bs-target="#forgotView" class="small text-primary">Forgot?</a>
                  </div>
                  <input type="password" id="loginPassword" class="form-control form-control-lg" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Log In to StayBuddy</button>
              </form>
            </div>

            <!-- Register View -->
            <div class="tab-pane fade" id="registerView">
              <form id="registerForm">
                <div class="mb-3">
                  <label class="form-label fw-semibold">Full Name</label>
                  <input type="text" id="regName" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold">Email Address</label>
                  <input type="email" id="regEmail" class="form-control" placeholder="john@university.edu" required>
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold">Password</label>
                  <input type="password" id="regPassword" class="form-control" placeholder="Minimum 6 characters" required>
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold">Select Account Role</label>
                  <select id="regRole" class="form-select" required>
                    <option value="USER">Dual Account (Guest & Host capabilities)</option>
                    <option value="HOST">Host Mode (List Rooms & Stays)</option>
                    <option value="MASTER_ADMIN">Master Admin (Platform Manager)</option>
                  </select>
                  <small class="text-muted fs-7">Single Account: Switch between Guest and Host mode anytime with 1 click!</small>
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold">City</label>
                  <input type="text" id="regCity" class="form-control" placeholder="Bengaluru, Delhi, Mumbai, Pune" required>
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold">Short Bio</label>
                  <textarea id="regBio" class="form-control" rows="2" placeholder="Tell hosts/peers about yourself..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Create Account</button>
              </form>
            </div>

            <!-- Forgot Password View -->
            <div class="tab-pane fade" id="forgotView">
              <h5 class="fw-bold mb-2">Reset Password</h5>
              <p class="text-muted small mb-3">Enter your registered email to receive a password reset link.</p>
              <form id="forgotForm">
                <div class="mb-3">
                  <label class="form-label fw-semibold">Email Address</label>
                  <input type="email" id="forgotEmail" class="form-control" placeholder="name@example.com" required>
                </div>
                <div id="forgotSuccessMsg" class="alert alert-success d-none small">
                  Reset link dispatched to your inbox!
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold mb-2">Send Reset Link</button>
                <button type="button" class="btn btn-link w-100 small text-muted" data-bs-toggle="pill" data-bs-target="#loginView">Back to Login</button>
              </form>
            </div>

          </div>

        </div>

        <div class="text-center mt-4">
          <a href="index.html" class="text-muted small text-decoration-none">← Back to Main Website</a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="assets/js/firebase.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
